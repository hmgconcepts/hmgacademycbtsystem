# ============================================================
# Supabase Auto-Restore Watchdog — V4.0 (Layer 10)
# ------------------------------------------------------------
# The last line of defence. Every keep-alive layer PREVENTS the
# pause; this workflow UNDOES it automatically if it ever happens
# anyway (e.g. every pinger failed in the same week).
#
# Daily, it asks the Supabase Management API for the project's
# status. If the project is INACTIVE (paused), it calls the
# official restore endpoint — the same thing the "Restore
# project" button in the dashboard does — waits for the project
# to come back, then writes a heartbeat so the timer restarts.
#
# ONE-TIME SETUP (2 minutes) — two repository secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  a Personal Access Token (starts with sbp_)
#                          from https://supabase.com/dashboard/account/tokens
#                          → "Generate new token", name it e.g. auto-restore
#   SUPABASE_PROJECT_REF   the 20-character code from your dashboard URL:
#                          https://supabase.com/dashboard/project/THIS-PART
#
# ⚠️ The access token manages your WHOLE Supabase account — store it
#    ONLY as a GitHub secret, never in code or config files.
# If the secrets are not set, the workflow skips gracefully with a
# notice (safe default for repos that don't want this layer).
# ============================================================
name: Supabase Auto-Restore Watchdog

on:
  schedule:
    # 05:43 UTC every day
    - cron: '43 5 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check project status and auto-restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets not set — auto-restore watchdog inactive (all prevention layers still run). Add them to enable automatic un-pausing."
            exit 0
          fi

          echo "Checking project $SUPABASE_PROJECT_REF status…"
          status=$(curl -s "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Reported status: ${status:-unknown}"

          if [ "$status" != "inactive" ] && [ "$status" != "paused" ]; then
            echo "✅ Project is ${status:-reachable} — nothing to restore."
            exit 0
          fi

          echo "🔴 Project is PAUSED. Requesting restore (this is what the dashboard's Restore button does)…"
          code=$(curl -s -o /tmp/restore.txt -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Restore endpoint HTTP $code: $(cat /tmp/restore.txt)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Restore request failed (HTTP $code). Restore manually: Supabase Dashboard → your project → 'Restore project'."
            exit 1
          fi

          # Wait for the project to come back (restores take 3-10 minutes)
          echo "Waiting for the project to come back online…"
          for i in $(seq 1 40); do
            sleep 20
            probe=$(curl -s -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/institutions?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
            echo "  attempt $i: REST answered HTTP ${probe:-unreachable}"
            if [ "$probe" = "200" ]; then
              # Write a fresh heartbeat so the inactivity timer restarts NOW
              curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/sc_keep_alive" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                -H "Content-Type: application/json" \
                -d '{"p_src":"auto-restore-watchdog"}' || true
              echo "✅ PROJECT RESTORED automatically and heartbeat re-armed. Total downtime: minutes, not days."
              exit 0
            fi
          done
          echo "::warning::Project had not answered after ~13 minutes. It may still be restoring — check the dashboard; the watchdog will retry tomorrow."
